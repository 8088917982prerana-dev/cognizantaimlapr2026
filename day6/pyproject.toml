#configuring toml
[project]
name = "asyncio-dashboard"
version = "1.0.0"
description = "a dashboard for monitoring asyncio dashboard"
readme = "README.md"
authors=[
    {name="Prerana",email="preranaprabhuraj30@gmail.com"}
]
requires-python = ">=3.8"
#production dependencies
dependencies=[
    "faker>=18.0.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    "asyncio>=3.4.0",
    "psutil>=5.9.0",
    "websockets>=10.0.0"
]
#development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=7.2.0",
    "black>=23.3.0",
    "isort>=5.10.1",
    "sphinx>=5.0.0"
]
[tool.black]
line-length = 88
target-version = ['py313']

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]


[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
banking_system = "app:check"

